<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in</title>
</head>
<body>
  <h1>Log in</h1>

  {% if error %}
    <p role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}">
    {{ form.hidden_tag() }}
    <p>{{ form.username.label }} {{ form.username(autocomplete="username") }}</p>
    <p>{{ form.password.label }} {{ form.password(autocomplete="current-password") }}</p>
    <p>{{ form.submit() }}</p>
  </form>
</body>
</html>
