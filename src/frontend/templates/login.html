<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Emperor's Collection | Sign-In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='../static/css/tailwind.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-[url('/../static/assets/sign-in_background.jpg')] bg-cover bg-fixed min-h-scren bg-right">
  <main class="sheet">
    <!-- Website name -->
    <!-- <p class="absolute top-4 left-4 font-display text-6xl font-bold text-slate-800/80">The Emperor's Collection</p> -->
    <!-- Sign-in box -->
    <div class="absolute top-1/6 left-1/8 h-2/3 w-1/3 rounded-2xl shadow-lg bg-gray-800/20 p-6 flex flex-col">
      <div class="bg-white/20 rounded-lg shadow-lg h-auto p-4 flex justify-center items-center mb-6">
        <p class="text-4xl font-bold text-slate-800/80 uppercase">Sign In</p>
      </div>
      <div class="bg-white/20 rounded-lg shadow-lg h-auto p-4 flex h-full">
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <form class="flex flex-col h-full w-full" method="post" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label class="p-1 text-slate-800/80" for="username">Username</label>
          <input class="p-1 border-b border-gray-800/20 shadow-lg text-slate-800/80 mb-4" placeholder="Type your username" id="username" name="username" type="text" autocomplete="username"
            maxlength="32" required autofocus>
          <label class="p-1 text-slate-800/80" for="password">Password</label>
          <input class="p-1 border-b border-gray-800/20 shadow-lg text-slate-800/80 mb-8" placeholder="Type your password" id="password" name="password" type="password"
            autocomplete="current-password" maxlength="128" required>
          <button class="transition-transform duration-500 hover:scale-105 bg-slate-400/50 uppercase self-center py-1 px-2 rounded-lg w-[20vw]" type="submit">Sign in</button>
        </form>
      </div>
    </div>
    <!-- Credits -->
    <p class="absolute bottom-2 left-2 text-sm p-1 text-slate-800/80">Artist - Angie McCall</p>
  </main>
</body>

</html>
