<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Emperor's Collection | Sign-In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='../static/css/tailwind.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-[url('/../static/assets/sign-in_background.jpg')] bg-cover bg-fixed min-h-scren bg-right">
  <main class="sheet">
    <!-- Sign-in box -->
    <div class="absolute top-1/6 left-1/8 h-2/3 w-1/3 rounded-2xl shadow-lg bg-gray-800/20 p-6 flex flex-col">
      <p class="text-4xl bold self-center mb-16 uppercase">Sign In</p>
      {% if error %}
      <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="bg-green-400" for="username">Username</label>
        <input class="my-4 block bg-red-400" id="username" name="username" type="text" autocomplete="username" maxlength="32" required autofocus>
        <label class="bg-green-400" for="password">Password</label>
        <input class="my-4 block bg-red-400" id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>

</html>
