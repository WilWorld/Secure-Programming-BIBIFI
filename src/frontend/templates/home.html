{% extends 'layout.html' %}

{% block title %}Home{% endblock %}

{% block content %}

<section class="panel">
  <ul class="rooms">
    {% for room in rooms %}
    <li>
      <a href="{{ url_for('room_detail', room_id=room.id) }}">
        <span>{{ room.name }}</span>
        <img src="../static/assets/placeholder.png" alt="placeholder">
      </a>
    </li>
    {% else %}
    <li>No rooms yet.</li>
    {% endfor %}
  </ul>
</section>

{% endblock %}
