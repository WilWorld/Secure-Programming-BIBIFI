<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <main class="page">
    <h1>Gallery</h1>
    <p class="lede">Record visits and see who is in each room.</p>

    {% if current_user.is_authenticated %}
    <section class="panel">
      <h2>Signed in</h2>
      <dl class="facts">
        <dt>User</dt>
        <dd>{{ current_user.username }}</dd>
        <dt>Role</dt>
        <dd>{{ current_user.role }}</dd>
      </dl>
      {% if current_user.role == 'administrator' %}
      <a class="button" href="{{ url_for('admin_home') }}">Administration</a>
      {% endif %}
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Sign out</button>
      </form>
    </section>
    {% else %}
    <a class="button" href="{{ url_for('auth.login') }}">Sign in</a>
    {% endif %}
  </main>
</body>
</html>
